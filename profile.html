<body>

<!-- ================= HERO ================= -->
<header class="hero">
    <h2>👤 User Medical Profile</h2>
    <p>Manage your personal and medical information</p>
</header>

<!-- ================= PROFILE SECTION ================= -->
<section class="split-section">

    <!-- FORM -->
    <div class="split-text">
        <h3>Enter Your Details</h3>

        <!-- ✅ FIXED FORM -->
        <form onsubmit="saveProfile(event)">

            <label>First Name</label>
            <input type="text" id="firstName" placeholder="Enter first name" required>

            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="Enter last name" required>

            <label>Email</label>
            <input type="text" id="email" placeholder="Enter email" required>

            <label>Age</label>
            <input type="number" id="age" placeholder="Enter your age" required>

            <label>Medical History</label>
            <textarea id="history" placeholder="Describe your medical history"></textarea>

            <label>Allergies</label>
            <input type="text" id="allergies" placeholder="Any allergies?">

            <button type="submit">Save Profile</button>

        </form>
    </div>

    <!-- IMAGE -->
    <div class="split-image">
        <img src="images/identity.jpg" alt="User medical profile illustration">
    </div>

</section>

<!-- ================= FOOTER ================= -->
<footer>
    <p>© 2026 AI Emergency Care</p>
</footer>

<script src="script.js"></script>

</body>
