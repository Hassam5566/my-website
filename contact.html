<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - AI Emergency Care</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= NAVIGATION ================= -->
<nav>
    <h1>AI Emergency Care</h1>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About AI</a></li>
        <li><a href="emergency.html">Emergency</a></li>
        <li><a href="monitor.html">Monitoring</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<!-- ================= HERO ================= -->
<header class="hero">
    <h2>📞 Contact & Support</h2>
    <p>Reach out to our AI healthcare support team</p>
</header>

<!-- ================= IMAGE ROW ================= -->
<section class="image-row">
    <img src="images/contact1.jpg" alt="Healthcare support team">
    <img src="images/contact2.jpg" alt="Medical assistance communication system">
</section>

<!-- ================= FORM ================= -->
<div class="container">

    <div class="card">
        <h3>Send Message</h3>

        <!-- ✅ FIXED FORM -->
        <form onsubmit="validateContactForm(event)">

            <label>First Name</label>
            <input type="text" id="firstName" placeholder="Enter first name" required>

            <label>Middle Name (Optional)</label>
            <input type="text" id="middleName" placeholder="Enter middle name">

            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="Enter last name" required>

            <label>Email</label>
            <input type="text" id="email" placeholder="Enter email" required>

            <label>Message</label>
            <textarea id="message" placeholder="Write your message" required></textarea>

            <button type="submit">Send Message</button>

        </form>

    </div>

</div>

<!-- ================= FOOTER ================= -->
<footer>
    <p>© 2026 AI Emergency Care</p>
</footer>

<script src="script.js"></script>

</body>
</html>
